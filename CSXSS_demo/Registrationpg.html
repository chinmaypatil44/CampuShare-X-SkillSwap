<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Unified Campus Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

  <!-- Top Navigation Bar -->
  <nav class="bg-[#1E3A8A] flex items-center justify-between px-6 py-4 shadow-md sticky top-0 z-50">
    <div class="flex items-center space-x-6">
      <div class="bg-white px-2 py-1 border border-gray-300 rounded shadow-sm flex items-center justify-center">
        <img src="logo.svg" alt="SkillSwap & CampuShare Logo" class="h-10 w-auto">
      </div>
      <div class="hidden md:flex space-x-3">
        <a href="HomePg.html" class="px-3 py-1.5 rounded text-white text-sm font-medium hover:bg-white/10 transition">Home</a>
        <a href="about.html" class="px-3 py-1.5 rounded text-white text-sm font-medium hover:bg-white/10 transition">About Us</a>
        <a href="services.html" class="px-3 py-1.5 rounded text-white text-sm font-medium hover:bg-white/10 transition">Services</a>
      </div>
    </div>

    <div class="absolute left-1/2 transform -translate-x-1/2 flex items-center space-x-3">
      <h1 class="text-[#FFFFFF] text-2xl tracking-wider font-semibold">Register</h1>
    </div>

    <div>
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-[#14B8A6] cursor-pointer hover:opacity-80 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="max-w-lg mx-auto px-4 py-12">
    <div class="bg-white rounded-lg p-8 border border-gray-200 shadow-sm">
      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-[#1E3A8A]">Create an Account</h2>
        <p class="text-sm text-gray-500 mt-2">Join your trusted campus network</p>
      </div>

      <!-- Action targets UserRegistrationServlet -->
      <form action="UserRegistrationServlet" method="POST" class="space-y-4">
        
        <div>
          <label for="name" class="block text-sm font-semibold text-[#1E3A8A] mb-1">Full Name</label>
          <input type="text" id="name" name="name" required 
                 class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#1E3A8A] bg-gray-50 text-sm text-gray-800" 
                 placeholder="As registered during admission">
        </div>

        <div>
          <label for="mail_id" class="block text-sm font-semibold text-[#1E3A8A] mb-1">Email ID</label>
          <input type="email" id="mail_id" name="mail_id" required 
                 class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#1E3A8A] bg-gray-50 text-sm text-gray-800" 
                 placeholder="As registered during admission">
        </div>

        <div class="relative">
          <label for="password" class="block text-sm font-semibold text-[#1E3A8A] mb-1">Password</label>
          <input type="password" id="password" name="password" required 
                 class="peer w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#1E3A8A] bg-gray-50 text-sm text-gray-800" 
                 placeholder="Create a password">
        </div>

        <div>
          <label for="phone_number" class="block text-sm font-semibold text-[#1E3A8A] mb-1">Phone Number</label>
          <input type="tel" id="phone_number" name="phone_number" required 
                 class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#1E3A8A] bg-gray-50 text-sm text-gray-800" 
                 placeholder="10-digit mobile number">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="year_of_study" class="block text-sm font-semibold text-[#1E3A8A] mb-1">Year of Study</label>
            <select id="year_of_study" name="year_of_study" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#1E3A8A] bg-gray-50 text-sm text-gray-800">
              <option value="" disabled selected>Select Year</option>
              <option value="First Year (FE)">First Year (FE)</option>
              <option value="Second Year (SE)">Second Year (SE)</option>
              <option value="Third Year (TE)">Third Year (TE)</option>
              <option value="Fourth Year (BE)">Fourth Year (BE)</option>
            </select>
          </div>

          <div>
            <label for="branch" class="block text-sm font-semibold text-[#1E3A8A] mb-1">Branch</label>
            <select id="branch" name="branch" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#1E3A8A] bg-gray-50 text-sm text-gray-800">
              <option value="" disabled selected>Select Branch</option>
              <option value="Computer Engineering">Computer Engineering</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Electronics & Telecom">Electronics & Telecom (EXTC)</option>
              <option value="AI DS">AI DS</option>
            </select>
          </div>
        </div>

        <div>
          <label for="college" class="block text-sm font-semibold text-[#1E3A8A] mb-1">College Name</label>
          <input type="text" id="college" name="college" required 
                 class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#1E3A8A] bg-gray-50 text-sm text-gray-800" 
                 placeholder="e.g. RGIT, Mumbai">
        </div>

        <button type="submit" class="w-full bg-[#1E3A8A] hover:bg-blue-800 text-white font-medium py-2.5 rounded transition shadow-sm mt-6">
          Register Account
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-600">
        Already have an account? 
        <a href="Login.html" class="text-[#14B8A6] font-semibold hover:underline">Login here</a>
      </div>
    </div>
  </main>
</body>
</html>
