<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Unified Campus Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navBg: '#1E3A8A',
                        navText: '#FFFFFF',
                        iconColor: '#14B8A6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Nav -->
    <nav class="bg-navBg shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4 md:space-x-8">
                    <div class="flex-shrink-0">
                        <div class="bg-white px-2 py-1 border border-gray-200 rounded shadow-sm flex items-center justify-center h-12 w-24">
                            <img src="logo.svg" alt="CampuShare Logo" class="h-10 w-auto transform scale-125 object-contain">
                        </div>
                    </div>
                    <nav class="hidden md:block">
                        <div class="flex space-x-3 items-center">
                            <a href="HomePg.html" class="bg-white/10 hover:bg-white/20 text-navText font-medium px-4 py-2 rounded-md border border-transparent hover:border-white/30 text-sm shadow-sm">Home</a>
                            <a href="about.html" class="bg-white/10 hover:bg-white/20 text-navText font-medium px-4 py-2 rounded-md border border-transparent hover:border-white/30 text-sm shadow-sm">About Us</a>
                            <a href="services.html" class="bg-white/10 hover:bg-white/20 text-navText font-medium px-4 py-2 rounded-md border border-transparent hover:border-white/30 text-sm shadow-sm">Services</a>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Login Card -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white p-8 sm:p-10 rounded-xl shadow-sm border border-gray-100">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800 relative inline-block mb-2">
                    Welcome Back
                    <span class="absolute bottom-0 left-0 w-1/2 h-1 bg-iconColor rounded-full -mb-1"></span>
                </h2>
                <p class="text-sm text-gray-500 mt-2">Access your unified campus account</p>
            </div>

            <!-- Posts to validate.jsp -->
            <form action="validate.jsp" method="POST" class="space-y-6">
                <div>
                    <label for="mail_id" class="block text-sm font-semibold text-gray-700 mb-2">College Email ID</label>
                    <input type="email" id="mail_id" name="mail_id" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-navBg focus:border-navBg bg-gray-50 text-sm text-gray-800 transition-colors" 
                           placeholder="student@college.edu">
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" name="password" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-navBg focus:border-navBg bg-gray-50 text-sm text-gray-800 transition-colors" 
                           placeholder="••••••••">
                </div>
                
                <div class="flex justify-end">
                    <a href="#" class="text-sm text-navBg font-medium hover:text-blue-700">Forgot password?</a>
                </div>

                <button type="submit" class="w-full bg-navBg hover:bg-blue-900 text-white font-medium py-3 rounded-md transition-colors shadow-sm mt-2">
                    Login
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-gray-600 border-t border-gray-100 pt-6">
                Don't have an account? 
                <a href="Registrationpg.html" class="text-iconColor font-semibold hover:text-teal-500 transition-colors">Register here</a>
            </div>
        </div>
    </main>
</body>
</html>
