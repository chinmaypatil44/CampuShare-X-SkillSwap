<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Services</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navBg: '#1E3A8A',       // Dark blue for top nav
                        navText: '#FFFFFF',     // White for nav links
                        iconColor: '#14B8A6',   // Teal for profile icon
                        photoBg: '#E2E8F0',     // Light gray for image placeholders
                    }
                }
            }
        }
    </script>
    
    <style>
        html {
            scroll-behavior: smooth;
        }
        a {
            transition: opacity 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-navBg shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                
                <!-- Logo Box and Desktop Navigation Buttons grouped together -->
                <div class="flex items-center space-x-4 md:space-x-8">
                    <!-- Logo Box -->
                     <div class="flex-shrink-0">
                        <!-- Placeholder for logo with white background as requested -->
                        <div class="bg-white rounded p-1 w-50 h-14 flex items-center justify-center border border-gray-200 shadow-sm">
                            <img src="logo.svg"class="h-14 w-auto drop-shadow-sm">
                        </div>
                    </div>
                    
                    <!-- Desktop Navigation Buttons -->
                    <nav class="hidden md:block">
                        <div class="flex space-x-3 items-center">
                            <a href="HomePg.html" class="bg-white/10 hover:bg-white/20 text-navText font-medium px-4 py-2 rounded-md transition-colors border border-transparent hover:border-white/30 text-sm shadow-sm">Home</a>
                            <a href="AbtUs.html" class="bg-white/10 hover:bg-white/20 text-navText font-medium px-4 py-2 rounded-md transition-colors border border-transparent hover:border-white/30 text-sm shadow-sm">About Us</a>
                            <a href="#" class="bg-white/10 hover:bg-white/20 text-navText font-medium px-4 py-2 rounded-md transition-colors border border-transparent hover:border-white/30 text-sm shadow-sm">Services</a>
                        </div>
                    </nav>
                </div>
                
                <!-- Profile Icon (Teal) -->
                <div class="flex items-center space-x-4">
                    <button aria-label="Profile" class="text-iconColor hover:text-teal-400 focus:outline-none transition-colors flex items-center justify-center">
                        <!-- Inline SVG for Profile Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </button>
                    <button aria-label="Menu" class="md:hidden text-navText focus:outline-none flex items-center justify-center">
                        <!-- Inline SVG for Hamburger Menu -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow">
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-20">
            
            <!-- Page Title -->
            <h2 class="text-3xl font-bold text-gray-800 mb-12 relative inline-block">
                Our Services:
                <span class="absolute bottom-0 left-0 w-1/2 h-1 bg-iconColor rounded-full -mb-2"></span>
            </h2>

            <!-- Grid Container: 1 col on mobile, 2 on tablet, 3 on desktop -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-x-8 gap-y-12">
                
                <!-- Service 1: E-Library -->
                <a href="E-Library.html" class="flex flex-col group">
                    <h3 class="text-xl font-semibold text-gray-900 mb-3 group-hover:text-navBg transition-colors pl-1">E-Library</h3>
                    <div class="w-full h-40 sm:h-48 bg-photoBg rounded-lg border-2 border-transparent group-hover:border-gray-300 shadow-sm flex items-center justify-center transition-all cursor-pointer">
                        <span class="text-gray-400 font-medium tracking-wide uppercase text-sm">Image / Icon</span>
                    </div>
                </a>

                <!-- Service 2: CampuShare -->
                <a href="CampuShare.html" class="flex flex-col group">
                    <h3 class="text-xl font-semibold text-gray-900 mb-3 group-hover:text-navBg transition-colors pl-1">CampuShare</h3>
                    <div class="w-full h-40 sm:h-48 bg-photoBg rounded-lg border-2 border-transparent group-hover:border-gray-300 shadow-sm flex items-center justify-center transition-all cursor-pointer">
                        <span class="text-gray-400 font-medium tracking-wide uppercase text-sm">Image / Icon</span>
                    </div>
                </a>

                <!-- Service 3: Courses -->
                <div class="flex flex-col group">
                    <h3 class="text-xl font-semibold text-gray-900 mb-3 group-hover:text-navBg transition-colors pl-1">Courses</h3>
                    <div class="w-full h-40 sm:h-48 bg-photoBg rounded-lg border-2 border-transparent group-hover:border-gray-300 shadow-sm flex items-center justify-center transition-all cursor-pointer">
                        <span class="text-gray-400 font-medium tracking-wide uppercase text-sm">Image / Icon</span>
                    </div>
                </div>

                <!-- Service 4: Mentorship -->
                <div class="flex flex-col group">
                    <h3 class="text-xl font-semibold text-gray-900 mb-3 group-hover:text-navBg transition-colors pl-1">Mentorship</h3>
                    <div class="w-full h-40 sm:h-48 bg-photoBg rounded-lg border-2 border-transparent group-hover:border-gray-300 shadow-sm flex items-center justify-center transition-all cursor-pointer">
                        <span class="text-gray-400 font-medium tracking-wide uppercase text-sm">Image / Icon</span>
                    </div>
                </div>

                <!-- Service 5: Community -->
                <div class="flex flex-col group">
                    <h3 class="text-xl font-semibold text-gray-900 mb-3 group-hover:text-navBg transition-colors pl-1">Community</h3>
                    <div class="w-full h-40 sm:h-48 bg-photoBg rounded-lg border-2 border-transparent group-hover:border-gray-300 shadow-sm flex items-center justify-center transition-all cursor-pointer">
                        <span class="text-gray-400 font-medium tracking-wide uppercase text-sm">Image / Icon</span>
                    </div>
                </div>

                <!-- Service 6: Account Management -->
                <div class="flex flex-col group">
                    <h3 class="text-xl font-semibold text-gray-900 mb-3 group-hover:text-navBg transition-colors pl-1">My Records</h3>
                    <div class="w-full h-40 sm:h-48 bg-photoBg rounded-lg border-2 border-transparent group-hover:border-gray-300 shadow-sm flex items-center justify-center transition-all cursor-pointer">
                        <span class="text-gray-400 font-medium tracking-wide uppercase text-sm">Image / Icon</span>
                    </div>
                </div>

            </div>
        </section>
    </main>
    
</body>
</html>
